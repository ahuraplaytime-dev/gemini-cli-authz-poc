name: 'Target Payload (simulates release-patch-1-create-pr.yml)'
on:
  workflow_dispatch:
    inputs:
      triggered_by:
        required: false
        type: string
      original_pr:
        required: false
        type: string
jobs:
  payload:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    steps:
      - run: |
          echo "### PAYLOAD WORKFLOW EXECUTED ###" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered by unauthorized commenter: ${{ inputs.triggered_by }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Original PR: ${{ inputs.original_pr }}" >> "$GITHUB_STEP_SUMMARY"
